<script>
    const SUPABASE_URL = "https://tniockgjahhdubpfjlaa.supabase.co";
    const SUPABASE_KEY = "sb_publishable__wl-rKNf318hez_4VhidgQ_RzDIQ4IF";

    const ctx = document.getElementById('moistureChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { 
            labels: [], 
            datasets: [{ 
                label: 'Soil Moisture (%)', 
                data: [], 
                borderColor: '#4CAF50', 
                backgroundColor: 'rgba(76, 175, 80, 0.1)',
                fill: true 
            }] 
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true, max: 100 }
            }
        }
    });

    async function fetchData() {
        try {
            const res = await fetch(SUPABASE_URL, {
                headers: { 
                    'apikey': SUPABASE_KEY 
                }
            });

            const data = await res.json();

            // Als Supabase een foutmelding geeft, is data geen Array
            if (!Array.isArray(data)) {
                console.error("Supabase API Fout:", data);
                return;
            }

            // Maak een kopie en keer de volgorde om (oudste links, nieuwste rechts)
            const sortedData = [...data].reverse();

            chart.data.labels = sortedData.map(d => d.created_at ? new Date(d.created_at).toLocaleTimeString() : '');
            chart.data.datasets[0].data = sortedData.map(d => d.humidity);
            chart.update();

        } catch (err) {
            console.error("Netwerkfout bij ophalen data:", err);
        }
    }

    fetchData();
    setInterval(fetchData, 10000); // Ververs elke 10 seconden
</script>
