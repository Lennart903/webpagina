<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Moisture Monitor</title>
    <!-- Chart.js bibliotheek -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="font-family: sans-serif; background: #121212; color: #fff; padding: 20px;">

    <h2 style="text-align: center;">🌱 Tuin Bodemvochtigheid</h2>

    <div style="width: 90%; max-width: 800px; margin: 0 auto;">
        <canvas id="moistureChart"></canvas>
    </div>

    <script>
        // Wacht gegarandeerd tot de hele pagina en de canvas geladen zijn
        window.addEventListener('load', () => {
            const SUPABASE_URL = "https://tniockgjahhdubpfjlaa.supabase.co/rest/v1/sensor_readings?select=*&order=created_at.desc&limit=20";
            const SUPABASE_KEY = "sb_publishable__wl-rKNf318hez_4VhidgQ_RzDIQ4IF";

            const canvas = document.getElementById('moistureChart');
            if (!canvas) {
                console.error("Kan 'moistureChart' canvas niet vinden.");
                return;
            }

            const ctx = canvas.getContext('2d');
            const chart = new Chart(ctx, {
                type: 'line',
                data: { 
                    labels: [], 
                    datasets: [{ 
                        label: 'Bodemvochtigheid (%)', 
                        data: [], 
                        borderColor: '#4CAF50', 
                        backgroundColor: 'rgba(76, 175, 80, 0.1)',
                        fill: true 
                    }] 
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });

            async function fetchData() {
                try {
                    const res = await fetch(SUPABASE_URL, {
                        headers: { 
                            'apikey': SUPABASE_KEY 
                        }
                    });

                    const data = await res.json();

                    if (!Array.isArray(data)) {
                        console.error("Supabase API Fout:", data);
                        return;
                    }

                    const sortedData = [...data].reverse();

                    chart.data.labels = sortedData.map(d => d.created_at ? new Date(d.created_at).toLocaleTimeString() : '');
                    chart.data.datasets[0].data = sortedData.map(d => d.humidity);
                    chart.update();

                } catch (err) {
                    console.error("Netwerkfout bij ophalen data:", err);
                }
            }

            // Meteen eerste meting ophalen en elke 10 seconden verversen
            fetchData();
            setInterval(fetchData, 10000);
        });
    </script>
</body>
</html>
